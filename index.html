<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LORE Resorts — ResortFlow CRM</title>
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: Inter, Segoe UI, Arial, sans-serif;
            background: #f4f0e7;
            color: var(--ink)
        }

        :root {
            --nav: #17352d;
            --blue: #456b5d;
            --green: #718b5a;
            --amber: #b89558;
            --red: #b45f54;
            --muted: #6d756f;
            --line: #e4dfd4;
            --card: #fffdf8;
            --cream: #f6f1e7;
            --ink: #25332d;
            --gold: #b89558
        }

        button,
        input,
        select,
        textarea {
            font: inherit
        }

        button {
            cursor: pointer;
            border: 0
        }

        .app {
            display: flex;
            min-height: 100vh
        }

        .sidebar {
            width: 260px;
            background: var(--nav);
            color: #dbe7f5;
            padding: 18px 12px;
            position: fixed;
            top: 0;
            bottom: 0;
            overflow: auto
        }

        .brand {
            font-family: Georgia, 'Times New Roman', serif;
            font-weight: 500;
            letter-spacing: 2px;
            font-size: 23px;
            padding: 8px 12px 20px;
            color: #f8f2e7
        }

        .brand small {
            display: block;
            color: #b9c8bb;
            font: 500 9px Inter, Arial, sans-serif;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            margin-top: 5px
        }

        .nav button {
            width: 100%;
            background: transparent;
            color: #c9d7e7;
            text-align: left;
            padding: 10px 12px;
            border-radius: 9px;
            margin: 2px 0
        }

        .nav button:hover,
        .nav button.active {
            background: #315548;
            color: white
        }

        .nav .group {
            font-size: 10px;
            color: #7890aa;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 16px 12px 6px
        }

        .main {
            margin-left: 260px;
            flex: 1
        }

        .top {
            height: 68px;
            background: white;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            position: sticky;
            top: 0;
            z-index: 10
        }

        .search {
            background: #f3f6fa;
            border: 1px solid var(--line);
            padding: 9px 13px;
            border-radius: 9px;
            width: 340px
        }

        .top-right {
            display: flex;
            gap: 10px;
            align-items: center
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #dbeafe;
            color: #1d4ed8;
            display: grid;
            place-items: center;
            font-weight: 700
        }

        .content {
            padding: 25px
        }

        .page-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px
        }

        .page-head h1 {
            margin: 0;
            font-family: Georgia, 'Times New Roman', serif;
            font-weight: 500;
            font-size: 27px;
            letter-spacing: .2px
        }

        .muted {
            color: var(--muted);
            font-size: 13px
        }

        .btn {
            padding: 9px 14px;
            border-radius: 8px;
            background: #eef2f7;
            color: #243247;
            font-weight: 600
        }

        .btn.primary {
            background: var(--nav);
            color: #fff
        }

        .btn.success {
            background: var(--green);
            color: white
        }

        .btn.danger {
            background: #f3dfdb;
            color: #8d3e35
        }

        .btn.sm {
            padding: 6px 9px;
            font-size: 12px
        }

        .grid {
            display: grid;
            gap: 16px
        }

        .g4 {
            grid-template-columns: repeat(4, 1fr)
        }

        .g3 {
            grid-template-columns: repeat(3, 1fr)
        }

        .g2 {
            grid-template-columns: repeat(2, 1fr)
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 17px;
            box-shadow: 0 3px 12px #3a463c0b
        }

        .stat {
            font-size: 28px;
            font-weight: 800;
            margin-top: 6px
        }

        .stat.green {
            color: #5e7b4c
        }

        .stat.blue {
            color: #456b5d
        }

        .stat.amber {
            color: #a27d3d
        }

        .stat.red {
            color: #a95249
        }

        .table {
            width: 100%;
            border-collapse: collapse
        }

        .table th,
        .table td {
            padding: 11px;
            border-bottom: 1px solid var(--line);
            text-align: left;
            font-size: 13px
        }

        .table th {
            color: #64748b;
            font-size: 11px;
            text-transform: uppercase
        }

        .badge {
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            display: inline-block
        }

        .bgreen {
            background: #dcfce7;
            color: #166534
        }

        .bblue {
            background: #dbeafe;
            color: #1d4ed8
        }

        .bamber {
            background: #fef3c7;
            color: #92400e
        }

        .bred {
            background: #fee2e2;
            color: #b91c1c
        }

        .tabs {
            display: flex;
            gap: 4px;
            border-bottom: 1px solid var(--line);
            margin-bottom: 16px
        }

        .tab {
            padding: 10px 13px;
            background: transparent;
            color: #64748b
        }

        .tab.active {
            color: #456b5d;
            border-bottom: 2px solid #b89558;
            font-weight: 700
        }

        .kanban {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px
        }

        .lane {
            background: #eef2f7;
            border-radius: 10px;
            padding: 10px;
            min-height: 440px
        }

        .lane h3 {
            font-size: 13px;
            margin: 3px 3px 10px
        }

        .leadcard {
            background: white;
            border: 1px solid var(--line);
            border-radius: 9px;
            padding: 11px;
            margin: 8px 0;
            box-shadow: 0 2px 4px #00000008
        }

        .leadcard b {
            font-size: 13px
        }

        .leadcard small {
            display: block;
            color: #64748b;
            margin-top: 4px
        }

        .field {
            margin-bottom: 12px
        }

        .field label {
            font-size: 12px;
            color: #64748b;
            font-weight: 700;
            display: block;
            margin-bottom: 5px
        }

        .field input,
        .field select,
        .field textarea {
            width: 100%;
            border: 1px solid #d9e0ea;
            border-radius: 8px;
            padding: 9px;
            background: white
        }

        .field textarea {
            min-height: 80px;
            resize: vertical
        }

        .formgrid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px
        }

        .full {
            grid-column: 1/-1
        }

        .modal {
            position: fixed;
            inset: 0;
            background: #07142599;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 50;
            padding: 20px
        }

        .modal.show {
            display: flex
        }

        .modalbox {
            background: #fff;
            width: min(900px, 96vw);
            max-height: 90vh;
            overflow: auto;
            border-radius: 14px;
            padding: 22px
        }

        .modalhead {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px
        }

        .close {
            background: #f1f5f9;
            border-radius: 50%;
            width: 32px;
            height: 32px
        }

        .timeline {
            border-left: 2px solid #dbe4ef;
            padding-left: 18px
        }

        .event {
            margin: 0 0 17px;
            position: relative
        }

        .event:before {
            content: "";
            position: absolute;
            left: -25px;
            top: 3px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #b89558
        }

        .timeline b {
            font-size: 13px
        }

        .timeline small {
            display: block;
            color: #64748b;
            margin-top: 3px
        }

        .progress {
            height: 8px;
            background: #e9eef5;
            border-radius: 20px;
            overflow: hidden
        }

        .progress span {
            display: block;
            height: 100%;
            background: #718b5a
        }

        .flow {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap
        }

        .node {
            padding: 9px 11px;
            border: 1px solid #d8e0eb;
            border-radius: 8px;
            background: #fff;
            font-size: 12px
        }

        .arrow {
            color: #b89558
        }

        .checklist label {
            display: block;
            padding: 7px 0
        }

        .checklist input {
            margin-right: 8px
        }

        .empty {
            padding: 35px;
            text-align: center;
            color: #64748b
        }

        .toast {
            position: fixed;
            right: 25px;
            bottom: 25px;
            background: #172033;
            color: white;
            padding: 12px 16px;
            border-radius: 9px;
            display: none;
            z-index: 100
        }

        .toast.show {
            display: block
        }

        .mini {
            font-size: 11px
        }

        .right {
            text-align: right
        }

        .section-title {
            font-size: 15px;
            font-weight: 800;
            margin: 20px 0 10px
        }

        .permission {
            display: grid;
            grid-template-columns: 1.3fr repeat(4, 1fr);
            border: 1px solid var(--line);
            border-bottom: 0
        }

        .permission>div {
            padding: 9px;
            border-bottom: 1px solid var(--line);
            font-size: 12px
        }

        .permission>div:nth-child(n+2) {
            text-align: center
        }

        .switch {
            width: 38px;
            height: 20px;
            border-radius: 20px;
            background: #cbd5e1;
            display: inline-block;
            vertical-align: middle;
            position: relative
        }

        .switch.on {
            background: #2563eb
        }

        .switch:after {
            content: "";
            width: 16px;
            height: 16px;
            background: #fff;
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 2px
        }

        .switch.on:after {
            left: 20px
        }

        .chart {
            height: 180px;
            display: flex;
            align-items: end;
            gap: 12px;
            padding: 10px
        }

        .bar {
            flex: 1;
            background: #718b5a;
            border-radius: 5px 5px 0 0;
            position: relative
        }

        .bar span {
            position: absolute;
            bottom: -20px;
            width: 100%;
            text-align: center;
            font-size: 10px;
            color: #64748b
        }

        .notice {
            padding: 10px 12px;
            background: #eff6ff;
            border-left: 4px solid #2563eb;
            border-radius: 6px;
            font-size: 12px
        }

        .danger-note {
            background: #fff7ed;
            border-left-color: #f59e0b
        }

        .responsive-note {
            display: none
        }

        @media(max-width:900px) {
            .sidebar {
                width: 72px
            }

            .brand {
                font-size: 0
            }

            .brand:before {
                content: "RF";
                font-size: 20px
            }

            .nav button span {
                display: none
            }

            .main {
                margin-left: 72px
            }

            .g4,
            .g3 {
                grid-template-columns: repeat(2, 1fr)
            }

            .kanban {
                grid-template-columns: 1fr 1fr
            }

            .search {
                width: 180px
            }
        }

        .logo-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 2px 8px 18px;
            padding-bottom: 14px;
            border-bottom: 1px solid #496458
        }

        .logo-wrap img {
            width: 43px;
            height: 43px;
            object-fit: contain;
            border-radius: 6px;
            background: #f7f2e8;
            padding: 4px
        }

        .logo-word {
            font-family: Georgia, 'Times New Roman', serif;
            letter-spacing: 3px;
            font-size: 20px;
            color: #f8f2e7
        }

        .logo-word small {
            display: block;
            font: 500 8px Inter, Arial, sans-serif;
            letter-spacing: 1.4px;
            color: #b9c8bb;
            margin-top: 3px
        }

        .top {
            background: #fffdf8;
            border-bottom-color: #ded8cc
        }

        .search {
            background: #f7f3eb;
            border-color: #ded8cc
        }

        h2,
        h3 {
            font-family: Georgia, 'Times New Roman', serif;
            font-weight: 500
        }

        /* Enhanced interactive module styling */
        .backbtn {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            background: #eee8db;
            color: #315548;
            font-size: 18px;
            margin-right: 10px
        }

        .subhead {
            display: flex;
            align-items: center
        }

        .report-card {
            cursor: pointer;
            transition: .15s;
            border: 1px solid var(--line)
        }

        .report-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px #3a463c14
        }

        .filterbar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 14px
        }

        .filterbar input,
        .filterbar select {
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 8px;
            background: #fffdf8
        }

        .doc {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--line)
        }

        .doc:last-child {
            border-bottom: 0
        }

        .doc-icon {
            font-size: 22px;
            margin-right: 9px
        }

        .pillnav {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 15px
        }

        .pillnav button {
            padding: 8px 11px;
            border: 1px solid var(--line);
            border-radius: 20px;
            background: #fffdf8
        }

        .pillnav button.active {
            background: #315548;
            color: #fff;
            border-color: #315548
        }


        /* --- Polished CRM UI --- */
        :root {
            --shadow-soft: 0 4px 18px rgba(39, 51, 45, .07);
            --shadow-modal: 0 24px 70px rgba(22, 38, 31, .20);
        }

        h1,
        h2,
        h3 {
            margin-top: 0
        }

        .page-head {
            min-height: 48px
        }

        .page-title-row {
            display: flex;
            align-items: center;
            gap: 10px
        }

        .back-btn {
            flex: 0 0 34px;
            width: 34px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--line);
            background: #fffdf8;
            border-radius: 9px;
            color: var(--nav);
            font-size: 18px;
            box-shadow: none;
        }

        .back-btn:hover {
            background: #f0eadf;
            border-color: #cfc6b6
        }

        .card {
            box-shadow: var(--shadow-soft)
        }

        .card-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px
        }

        .card-head h3 {
            margin-bottom: 3px
        }

        .dashboard-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 16px;
        }

        .dashboard-title h1 {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 30px;
            font-weight: 500;
            margin: 2px 0 3px
        }

        .eyebrow {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1.6px;
            color: #8a7041;
            text-transform: uppercase
        }

        .dashboard-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 7px;
            flex-wrap: wrap
        }

        .dashboard-actions .btn {
            white-space: nowrap
        }

        .dashboard-datebar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 13px;
            margin-bottom: 16px;
            background: #eee8db;
            border: 1px solid #e2d9c8;
            border-radius: 9px;
            color: #425047;
            font-size: 12px;
        }

        .green-dot {
            background: #718b5a
        }

        .status-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            margin-right: 4px
        }

        .dashboard-kpis {
            margin-bottom: 16px
        }

        .dashboard-main-grid {
            margin-top: 16px
        }

        .dashboard-chart {
            height: 205px
        }

        .chart-legend {
            display: flex;
            gap: 18px;
            color: var(--muted);
            font-size: 11px
        }

        .legend-box {
            display: inline-block;
            width: 9px;
            height: 9px;
            border-radius: 2px;
            margin-right: 5px
        }

        .revenue-box {
            background: #718b5a
        }

        .occupancy-box {
            background: #b89558
        }

        .ops-list {
            display: flex;
            flex-direction: column
        }

        .ops-row {
            display: grid;
            grid-template-columns: 34px 1fr auto;
            align-items: center;
            gap: 9px;
            padding: 10px 0;
            border-bottom: 1px solid var(--line)
        }

        .ops-row:last-child {
            border-bottom: 0
        }

        .ops-row small {
            display: block;
            color: var(--muted);
            margin-top: 2px;
            font-size: 11px
        }

        .ops-icon {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            background: #f0eadf;
            display: grid;
            place-items: center;
            color: #456b5d;
            font-weight: 800
        }

        .funnel-row,
        .channel-row,
        .split-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            margin: 9px 0 5px
        }

        .funnel-track,
        .mini-progress {
            height: 7px;
            background: #ebe8df;
            border-radius: 10px;
            overflow: hidden
        }

        .funnel-track span,
        .mini-progress span {
            display: block;
            height: 100%;
            background: #718b5a;
            border-radius: 10px
        }

        .room-summary {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 7px
        }

        .room-stat {
            background: #f6f1e7;
            border-radius: 8px;
            padding: 11px 5px;
            text-align: center
        }

        .room-stat b {
            display: block;
            font-size: 19px;
            color: #456b5d
        }

        .room-stat small {
            font-size: 10px;
            color: var(--muted)
        }

        .event-mini {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid var(--line)
        }

        .event-mini:last-of-type {
            border-bottom: 0
        }

        .event-mini small {
            display: block;
            color: var(--muted);
            margin-top: 3px;
            font-size: 11px
        }

        .date-chip {
            flex: 0 0 50px;
            height: 50px;
            border-radius: 12px;
            background: #e6eef8;
            color: #315e9b;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            line-height: 1
        }

        .date-chip b {
            font-size: 16px
        }

        .date-chip small {
            font-size: 9px;
            font-weight: 800;
            letter-spacing: .8px;
            margin-top: 4px;
            color: #315e9b
        }

        .compact-table th,
        .compact-table td {
            padding: 9px 7px
        }

        .alert-card {
            background: #fffdf8
        }

        .guest-score {
            font-size: 38px;
            font-weight: 800;
            color: #5e7b4c;
            line-height: 1;
            margin: 15px 0 5px
        }

        .guest-score small {
            font-size: 14px;
            color: var(--muted);
            font-weight: 600
        }

        .quick-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px
        }

        .quick-card {
            min-height: 92px;
            padding: 15px 16px;
            border: 1px solid #ded8cc;
            border-radius: 12px;
            background: #fffdf8;
            display: flex;
            align-items: center;
            gap: 13px;
            text-align: left;
            transition: transform .15s, box-shadow .15s, border-color .15s;
        }

        .quick-card:hover {
            transform: translateY(-2px);
            border-color: #c7b89b;
            box-shadow: 0 8px 22px rgba(45, 55, 47, .08)
        }

        .quick-card span:last-child {
            display: flex;
            flex-direction: column;
            gap: 4px
        }

        .quick-card b {
            font-size: 14px;
            color: #17241e
        }

        .quick-card small {
            font-size: 11px;
            color: var(--muted)
        }

        .quick-icon {
            width: 42px;
            height: 42px;
            flex: 0 0 42px;
            border-radius: 11px;
            background: #f1eadf;
            display: grid;
            place-items: center;
            font-size: 20px;
        }

        .modalbox {
            width: min(980px, 96vw);
            max-height: 90vh;
            overflow: auto;
            border-radius: 16px;
            padding: 24px;
            box-shadow: var(--shadow-modal);
            background: #fffdf8;
        }

        .modalhead {
            align-items: flex-start
        }

        .modalhead h2 {
            font-size: 25px;
            margin: 2px 0 4px
        }

        .close {
            width: 36px;
            height: 36px;
            display: grid;
            place-items: center;
            background: #f1eee7;
            color: #25332d;
            font-size: 18px
        }

        .badge {

                x.classList.remove('active');
            });

            if (el) el.classList.add('active');

            let leads = [...state.leads];

            if (type === 'mine') {
                leads = leads.filter(function (x) {
                    return x.owner === 'Amit';
                });
            }

            if (type === 'unassigned') {
                leads = leads.filter(function (x) {
                    return !x.owner;
                });
            }

            if (type === 'followups') {
                leads = leads.filter(function (x) {
                    return x.stage !== 'Won' && x.stage !== 'Lost' && x.id % 2 === 1;
                });
            }

            const sourceEl = document.getElementById('leadSourceFilter');
            const stageEl = document.getElementById('leadStageFilter');
            const searchEl = document.getElementById('leadSearch');

            const source = sourceEl ? sourceEl.value : '';
            const stage = stageEl ? stageEl.value : '';
            const search = searchEl ? searchEl.value.toLowerCase().trim() : '';

            if (source && source !== 'All Sources') {
                leads = leads.filter(function (x) {
                    return x.source === source;
                });
            }

            if (stage && stage !== 'All Stages') {
                leads = leads.filter(function (x) {
                    return x.stage === stage;
                });
            }

            if (search) {
                leads = leads.filter(function (x) {
                    const text = [
                        x.name,
                        x.phone,
                        x.owner,
                        x.source,
                        x.stage
                    ].join(' ').toLowerCase();

                    return text.includes(search);
                });
            }

            const wrapper = document.getElementById('leadTableWrap');

            if (!wrapper) return;

            const tbody = wrapper.querySelector('tbody');

            if (!tbody) return;

            tbody.innerHTML = leads.map(function (lead) {
                const followUp =
                    lead.stage === 'Won'
                        ? '—'
                        : lead.id % 2 === 1
                            ? 'Today 4 PM'
                            : 'Tomorrow 11 AM';

                return `
            <tr class="clickable-row">
                <td>
                    <b>${lead.name}</b>
                    <br>
                    <span class="muted">${lead.phone}</span>
                </td>
                <td>${lead.source}</td>
                <td>
                    <span class="badge ${lead.stage === 'Won'
                        ? 'bgreen'
                        : lead.stage === 'New'
                            ? 'bblue'
                            : 'bamber'
                    }">${lead.stage}</span>
                </td>
                <td>${lead.owner || 'Unassigned'}</td>
                <td>${lead.score}</td>
                <td>${lead.touches} times</td>
                <td>${lead.last}</td>
                <td>${followUp}</td>
                <td>
                    <button
                        class="btn sm"
                        onclick="openLeadDetails(${Number(lead.id)})"
                    >
                        View
                    </button>
                </td>
            </tr>
        `;
            }).join('');
        }

                roi: ['Marketing ROI Report', [['Channel', 'Spend', 'Leads', 'Bookings', 'Revenue', 'ROI'], ['Meta', '₹80K', '240', '32', '₹3.4L', '4.25x'], ['Google', '₹1.1L', '310', '41', '₹4.8L', '4.36x'], ['Instagram', '₹45K', '180', '19', '₹2.1L', '4.67x'], ['WhatsApp', '₹18K', '150', '22', '₹2.8L', '15.56x']]],
                guest: ['Guest Satisfaction Report', [['Metric', 'Score', 'Cases', 'Resolved'], ['Overall Rating', '4.6/5', '112', '108'], ['Cleanliness', '4.7/5', '21', '21'], ['Service', '4.5/5', '34', '33'], ['Food', '4.4/5', '18', '17']]]
            };
            let d = data[key]; box.innerHTML = `<div class="notice">Dummy report preview • generated ${new Date().toLocaleString()}</div><br><table class="table"><tr>${d[1][0].map(x => `<th>${x}</th>`).join('')}</tr>${d[1].slice(1).map(r => `<tr>${r.map(x => `<td>${x}</td>`).join('')}</tr>`).join('')}</table><br><button class="btn primary" onclick="exportCSV('${key}')">Export CSV</button> <button class="btn" onclick="toast('PDF report generated')">Export PDF</button>`
        }
        function exportCSV(key = 'report') { let csv = 'Metric,Value\\nReport,' + key + '\\nGenerated,' + new Date().toLocaleString() + '\\n'; let blob = new Blob([csv], { type: 'text/csv' }), a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `lore-${key}-report.csv`; a.click(); URL.revokeObjectURL(a.href); toast('CSV downloaded') }

        /* Users */
        const users = [
            ['Bhairav Admin', 'admin@lore.example', 'Admin', 'Active'],
            ['Amit Sales', 'amit@lore.example', 'Sales', 'Active'],
            ['Pooja Housekeeping', 'pooja@lore.example', 'Housekeeper', 'Active'],
            ['Ramesh Kitchen', 'ramesh@lore.example', 'Chef / Kitchen', 'Active'],
            ['Priya Front Desk', 'priya@lore.example', 'Front Desk', 'Active']
        ];
        function renderUsers() { const l = document.getElementById('userList'), p = document.getElementById('userPerm'); if (!l) return; l.innerHTML = users.map((u, i) => `<div style="padding:10px 0;border-bottom:1px solid var(--line)"><b>${u[0]}</b><div class="muted">${u[1]} • ${u[2]}</div><span class="badge bgreen">${u[3]}</span> <button class="btn sm" onclick="selectUser(${i})">Permissions</button></div>`).join(''); selectUser(0) }
        function selectUser(i) { let u = users[i], p = document.getElementById('userPerm'); if (!p) return; p.innerHTML = `<p><b>${u[0]}</b> — ${u[2]}</p><div class="permission"><div><b>Component</b></div><div><b>Create</b></div><div><b>Read</b></div><div><b>Update</b></div><div><b>Delete</b></div>${['Leads', 'Bookings', 'Guests', 'Payments', 'Housekeeping', 'Packages', 'Events', 'Reports', 'Settings'].map(x => `<div>${x}</div><div><span class="switch ${x === 'Reports' ? '' : 'on'}"></span></div><div><span class="switch on"></span></div><div><span class="switch on"></span></div><div><span class="switch"></span></div>`).join('')}</div><br><div class="notice">Additional controls: field-level visibility, export, approval limits, API access, button visibility, MFA requirement and login/session policy.</div>` }

        /* Extra modals */
        const oldOpenModal = openModal;
        openModal = function (type, data = {}) {
            if (type === 'hkTask') {
                showCustomModal('Assign Housekeeping Task', `
 <div class="formgrid">${field('Room', 'hkRoom', '301', ['101', '102', '201', '202', '301', '302'])}${field('Task Type', 'hkType', 'Deep Cleaning', ['Checkout Cleaning', 'Deep Cleaning', 'Linen Change', 'Minibar Refill', 'Inspection', 'Maintenance Handoff'])}
 ${field('Assign Staff', 'hkAssign', 'Pooja', ['Pooja', 'Ramesh', 'Anita', 'Manager'])}${field('Priority', 'hkPriority', 'Normal', ['Low', 'Normal', 'High', 'Urgent'])}
 ${field('Due Time', 'hkDue', '14:00')}${field('Status', 'hkStatus', 'To Clean', ['To Clean', 'In Cleaning', 'Inspection', 'Ready'])}
 <div class="field full"><label>Checklist</label><div class="checklist"><label><input type="checkbox" checked> Bed & linen</label><label><input type="checkbox" checked> Bathroom</label><label><input type="checkbox"> Minibar</label><label><input type="checkbox"> Photos</label><label><input type="checkbox"> Maintenance issue check</label></div></div></div>
 <button class="btn primary" onclick="addHKTask()">Assign Task</button>`); return
            }
            if (type === 'package') {
                showCustomModal(data !== undefined ? 'Create / Edit Package' : 'Create Package', `
 <div class="formgrid">${field('Package Name', 'pName', 'Romantic Escape')}${field('Package Type', 'pType', 'Stay Package', ['Stay Package', 'Activity', 'Dining', 'Spa', 'Transfer', 'Event'])}
 ${field('Base Price', 'pPrice', '18000')}${field('Tax', 'pTax', '18%')}
 ${field('Room Type', 'pRoom', 'Villa', ['Villa', 'Premium Suite', 'Deluxe Garden', 'None'])}${field('Capacity', 'pCap', '2')}
 <div class="field full"><label>Inclusions</label><textarea id="pInc">Breakfast, Romantic Dinner, Room Decor, Activity</textarea></div>
 <div class="field full"><label>Inventory / Scheduling Rules</label><textarea>Activity slots: 10/day. Minimum stay: 2 nights. Blackout dates configurable.</textarea></div></div>
 <button class="btn primary" onclick="savePackage()">Save Package</button>`); return
            }
            if (type === 'integration') {
                showCustomModal('Connect Integration', `
 <div class="formgrid">${field('Tool', 'iTool', 'Meta Ads', ['Meta Ads', 'Instagram', 'WhatsApp Business', 'Google Ads', 'Google Business Profile', 'Email / SMTP', 'SMS Gateway', 'OTA / Channel Manager', 'Payment Gateway'])}${field('Environment', 'iEnv', 'Production', ['Sandbox', 'Production'])}
 ${field('Account / Property ID', 'iAccount', 'LORE-RESORT-001')}${field('Webhook URL', 'iWebhook', 'https://example.com/webhooks/resort')}</div>
 <div class="notice">Credentials should be stored encrypted in the backend. This prototype simulates the connection/test flow.</div><br><button class="btn primary" onclick="toast('Connection test successful');closeModal();go('marketing')">Connect & Test</button>`); return
            }
            if (type === 'user') {
                showCustomModal('Create User', `
 <div class="formgrid">${field('Full Name', 'uName', 'New Employee')}${field('Email', 'uEmail', 'employee@lore.example')}${field('Mobile', 'uMobile', '+91')}${field('Role', 'uRole', 'Front Desk', ['Admin', 'Manager / PA', 'Sales', 'Front Desk', 'Chef / Kitchen', 'Housekeeper', 'Maintenance', 'Finance', 'Event Manager', 'Marketing', 'Viewer'])}
 ${field('Department', 'uDept', 'Front Office', ['Front Office', 'Sales', 'Kitchen', 'Housekeeping', 'Maintenance', 'Finance', 'HR', 'IT', 'Management'])}${field('Employee ID', 'uId', 'EMP-1006')}
 <div class="field full"><label>Access</label><div class="checklist"><label><input type="checkbox" checked> Email invitation</label><label><input type="checkbox" checked> MFA required</label><label><input type="checkbox"> Restrict export</label></div></div></div>
 <button class="btn primary" onclick="saveUser()">Create User & Assign Permissions</button>`); return
            }
            oldOpenModal(type, data);
        }
        function showCustomModal(title, body) { document.getElementById('modal').classList.add('show'); document.getElementById('modalbox').innerHTML = `<div class="modalhead"><h2>${title}</h2><button class="close" onclick="closeModal()">✕</button></div>${body}` }
        function addHKTask() { hkTasks.push(['HK-' + (1006 + hkTasks.length), document.getElementById('hkRoom').value, document.getElementById('hkType').value, document.getElementById('hkAssign').value, document.getElementById('hkPriority').value, document.getElementById('hkStatus').value]); closeModal(); toast('Housekeeping task assigned'); go('housekeeping') }
        function savePackage() { packages.push([document.getElementById('pName').value, `₹${document.getElementById('pPrice').value}`, document.getElementById('pInc').value, 'Active']); closeModal(); toast('Package created successfully'); go('packages') }
        function saveUser() { users.push([document.getElementById('uName').value, document.getElementById('uEmail').value, document.getElementById('uRole').value, 'Active']); closeModal(); toast('User created and invitation sent'); go('users') }

        /* Replace renderer with enhanced renderer. */
        render = renderEnhanced;
        initIcons();
        go('dashboard');

    </script>
</body>
